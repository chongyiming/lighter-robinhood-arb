# Lighter mainnet × Lighter on Robinhood Chain — BTC arbitrage strategy config
#
#   python3 main.py --base lighter --hedge lighter-rh --symbol BTC
#
# This file is the strategy itself; keys live in .env. Every key name is
# validated, and a typo is an immediate error.
#
# Signal: premium_bps = (Lighter price / Robinhood price - 1) * 10000
#   Sell Lighter / buy Robinhood: executable premium >= midline + upper
#   Buy Lighter / sell Robinhood: executable premium <= midline - lower
# Both hurdles are net of taker fees on both legs, so one full round trip
# nets >= upper + lower after fees.

# ============================== THE SIGNAL =================================
# midline +0.33 is the median of 3941 rows in data/premium_data.csv
# (2026-09-13 ~ 09-16). Backtesting a ±1.0 band on that data: 8 round trips
# in 3 days, about 21.7 bps total.
# Note: the historical data is top-of-book spread, while the new engine uses
# the marginal spread after walking depth, which is stricter, so it will
# trigger less often than the backtest. Run --record-only for a while first,
# then re-check with tools/analyze.py.
thresholds:
  midline_bps: 0.328 # long-run premium center
  upper_bps: 1 # entry band above the midline (sell Lighter)
  lower_bps: 1 # entry band below the midline (buy Lighter)

# ================================ VENUES ===================================
# base = base leg (--base, default Lighter mainnet); hedge = hedge leg (default RH).
# max_orders_per_min: Lighter's limit is about 40/min; keep both legs at 30.
base:
  taker_fee_bps: 0.0
  max_position_usd: 60 # per-leg position cap (USD)
  max_orders_per_min: 30

hedge:
  taker_fee_bps: 0.0
  max_position_usd: 60
  max_orders_per_min: 30

# ================================ SIZING ===================================
# Size is not fixed: compute how much can be taken at the current spread,
# take take_fraction of it, then clip to max_order_notional_usd and the
# position cap.
# The floor matters: Robinhood's BTC minimum order is 0.0002 BTC (about $16),
# so max_order_notional_usd must be well above it or no order will ever go out.
sizing:
  take_fraction: 0.5
  max_order_notional_usd: 30 # per-order notional cap (about 0.00038 BTC)
  min_order_notional_usd: 10

# =========================== INVENTORY LADDER ==============================
# Once a position exceeds floor_frac of the cap, adding in the same direction
# requires extra premium, rising to scale_bps at a full position.
inventory:
  scale_bps: 10.0
  floor_frac: 0.5

# =============================== EXECUTION =================================
execution:
  premium_persist_sec: 0.3 # signal must persist this long before ordering; filters one-tick blips
  cooldown_sec: 0.0 # minimum gap between executions
  settle_timeout_sec: 10.0 # wait for fill confirmation (account_orders channel)
  leg_slippage_bps: 10.0 # per-leg protection price; the edge is only a few bps, so keep it tight
  hedge_slippage_bps: 20.0 # protection price for hedge reductions, looser so they fill
  net_tolerance_base: 0.0002 # allowed net exposure (BTC), = RH min order size; smaller can't be hedged
  max_consecutive_errors: 3 # halt after N consecutive failures, wait for manual handling
  rate_limit_pause_sec: 10.0
  staleness_sec: 10.0 # order book disconnect threshold
  reconcile_sec: 15.0 # REST position reconciliation interval
  venue_probe_sec: 30.0
  http_keepalive_sec: 10.0

# =============================== RECORDER ==================================
# While running, samples both books every second and writes one row per
# minute, for re-checking thresholds with tools/analyze.py.
recorder:
  enabled: true
  csv: logs/minutes.csv

# ================================ LOGGING ==================================
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/trades.csv
  dashboard: true
  file: logs/engine.log
